[project]
name = "gf"
version = "0.1.0"
description = "终焉花海"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pygame-ce"]

[dependency-groups]
dev = ["basedpyright", "ruff"]

[tool.ruff]
target-version = "py314"
include = ["main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["main"]

[tool.basedpyright]
include = ["main.py"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
